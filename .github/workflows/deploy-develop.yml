name: Deploy develop to ECS

# Every push to develop: run the full CI checks, build the image, push it to ECR,
# run the database migrations as a one-off ECS task, then roll the ECS service.
# AWS setup and the GitHub variables this needs are in docs/deploy.md.

on:
  push:
    branches: [develop]
  workflow_dispatch:

# One develop deploy at a time; a newer push waits rather than cancelling a rollout mid-way.
concurrency:
  group: deploy-develop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: develop
    permissions:
      contents: read
      id-token: write # GitHub OIDC token, exchanged for the AWS deploy role
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME || 'api' }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check required variables
        run: |
          missing=""
          for v in AWS_REGION ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] || missing="$missing AWS_DEPLOY_ROLE_ARN"
          if [ -n "$missing" ]; then
            echo "::error::Set these variables on the 'develop' environment:$missing (see docs/deploy.md)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --pull -t "$image" .
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Register task definition with the new image
        id: taskdef
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0]' --output json > service.json
          current=$(jq -r '.taskDefinition // empty' service.json)
          if [ -z "$current" ]; then
            echo "::error::ECS service $ECS_SERVICE was not found in cluster $ECS_CLUSTER"
            exit 1
          fi

          # Start from the latest revision of the service's task definition family, so roles,
          # secrets, env vars and sizing stay owned by Terraform (infra/terraform/ecs-nonprod).
          # Only the image changes. A Terraform change to the family is picked up on the next run.
          family=$(aws ecs describe-task-definition --task-definition "$current" \
            --query taskDefinition.family --output text)
          aws ecs describe-task-definition --task-definition "$family" \
            --query taskDefinition --output json > current-taskdef.json
          if ! jq -e --arg c "$CONTAINER_NAME" '.containerDefinitions[] | select(.name == $c)' current-taskdef.json > /dev/null; then
            echo "::error::Container '$CONTAINER_NAME' is not in $current. Set ECS_CONTAINER_NAME."
            exit 1
          fi
          jq --arg c "$CONTAINER_NAME" --arg img "$IMAGE" '
            (.containerDefinitions[] | select(.name == $c) | .image) = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                  .registeredAt, .registeredBy, .deregisteredAt)
          ' current-taskdef.json > new-taskdef.json

          arn=$(aws ecs register-task-definition --cli-input-json file://new-taskdef.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "Registered $arn"
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        env:
          TASK_DEF: ${{ steps.taskdef.outputs.arn }}
        run: |
          # Same network and capacity as the service, new image, migration command.
          jq --arg c "$CONTAINER_NAME" --arg cluster "$ECS_CLUSTER" --arg td "$TASK_DEF" '{
              cluster: $cluster,
              taskDefinition: $td,
              count: 1,
              startedBy: "github-deploy-migrate",
              networkConfiguration: .networkConfiguration,
              overrides: { containerOverrides: [ { name: $c, command: ["node", "dist-openapi/scripts/migrate.js"] } ] }
            }
            + (if (.capacityProviderStrategy // []) | length > 0
               then { capacityProviderStrategy: .capacityProviderStrategy }
               else { launchType: (.launchType // "FARGATE") } end)
            | with_entries(select(.value != null))
          ' service.json > run-task.json

          task=$(aws ecs run-task --cli-input-json file://run-task.json --query 'tasks[0].taskArn' --output text)
          if [ -z "$task" ] || [ "$task" = "None" ]; then
            echo "::error::The migration task did not start"
            aws ecs run-task --cli-input-json file://run-task.json --query failures || true
            exit 1
          fi
          echo "Migration task $task"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task"

          aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task" --output json > migrate-task.json
          code=$(jq -r --arg c "$CONTAINER_NAME" '.tasks[0].containers[] | select(.name == $c) | .exitCode // "none"' migrate-task.json)
          if [ "$code" != "0" ]; then
            echo "::error::Migrations failed (exit code $code). Stopped reason: $(jq -r '.tasks[0].stoppedReason' migrate-task.json). The service was not updated; see the task's CloudWatch logs."
            exit 1
          fi
          echo "Migrations are up to date."

      - name: Deploy to the ECS service
        env:
          TASK_DEF: ${{ steps.taskdef.outputs.arn }}
        run: |
          # Terraform creates the service at 0 tasks (no image yet); the first deploy scales it to 1.
          scale=()
          if [ "$(jq -r '.desiredCount' service.json)" = "0" ]; then scale=(--desired-count 1); fi
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF" "${scale[@]}" --query 'service.serviceName' --output text
          echo "Waiting for the service to become stable..."
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

          rollout=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query "services[0].deployments[?status=='PRIMARY'] | [0]" --output json)
          td=$(echo "$rollout" | jq -r '.taskDefinition')
          state=$(echo "$rollout" | jq -r '.rolloutState // "UNKNOWN"')
          if [ "$td" != "$TASK_DEF" ] || [ "$state" = "FAILED" ]; then
            echo "::error::Deployment did not complete (primary task definition $td, rollout $state). The circuit breaker may have rolled back."
            exit 1
          fi
          echo "Deployed $TASK_DEF ($state)" >> "$GITHUB_STEP_SUMMARY"
